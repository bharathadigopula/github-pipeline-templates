#==============================================================================
# DEPENDENCY UPDATES
#==============================================================================

version: 2

#==============================================================================
# GITHUB ACTION UPDATES
#==============================================================================

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"