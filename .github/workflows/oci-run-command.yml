#==============================================================================
# SHARED OCI RUN COMMAND WORKFLOW
#==============================================================================

name: Shared OCI Run Command

#==============================================================================
# WORKFLOW INPUTS AND SECRETS
#==============================================================================

on:
  workflow_call:
    inputs:
      automation_repository:
        description: Public repository containing versioned automation scripts
        required: true
        type: string
      automation_ref:
        description: Immutable release tag for the automation repository
        required: true
        type: string
      template_ref:
        description: Immutable release tag containing the workflow support scripts
        required: true
        type: string
      compartment_ocid:
        description: OCI compartment containing the target instances
        required: true
        type: string
      display_name:
        description: Safe display name used for OCI commands and artifacts
        required: true
        type: string
      region:
        description: OCI region identifier
        required: true
        type: string
      required_output_marker:
        description: Output marker required from every successful target
        required: false
        type: string
        default: ""
      script_path:
        description: Host script path relative to the automation repository
        required: true
        type: string
      targets_json:
        description: JSON array containing target names, instance OCIDs, and script arguments
        required: true
        type: string
      timeout_seconds:
        description: Maximum execution time allowed on each instance
        required: false
        type: number
        default: 300
      vault_secret_name:
        description: OCI Vault secret whose current value is appended as the final script argument
        required: false
        type: string
        default: ""
    secrets:
      OCI_TENANCY_OCID:
        required: true
      OCI_USER_OCID:
        required: true
      OCI_FINGERPRINT:
        required: true
      OCI_PRIVATE_KEY:
        required: true

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# VERSIONED HOST AUTOMATION
#==============================================================================

jobs:
  run-command:
    name: OCI Run Command
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      AUTOMATION_DIRECTORY: ${{ github.workspace }}/.host-automation
      AUTOMATION_REF: ${{ inputs.automation_ref }}
      OCI_CLI_VERSION: 3.91.0
      OCI_COMPARTMENT_OCID: ${{ inputs.compartment_ocid }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ inputs.region }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      RUN_COMMAND_DISPLAY_NAME: ${{ inputs.display_name }}
      RUN_COMMAND_REQUIRED_OUTPUT_MARKER: ${{ inputs.required_output_marker }}
      RUN_COMMAND_RESULTS_DIRECTORY: ${{ github.workspace }}/run-command-results
      RUN_COMMAND_SCRIPT_PATH: ${{ inputs.script_path }}
      RUN_COMMAND_TARGETS: ${{ inputs.targets_json }}
      RUN_COMMAND_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      RUN_COMMAND_VAULT_SECRET_NAME: ${{ inputs.vault_secret_name }}
      SUPPRESS_LABEL_WARNING: "True"
      TEMPLATE_REF: ${{ inputs.template_ref }}

    steps:
      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Checkout versioned host automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.automation_repository }}
          ref: ${{ inputs.automation_ref }}
          path: .host-automation

      - name: Validate Run Command configuration
        run: bash .pipeline-templates/scripts/oci/validate-run-command.sh

      - name: Install pinned OCI CLI
        run: bash .pipeline-templates/scripts/oci/install-cli.sh

      - name: Configure OCI authentication
        run: bash .pipeline-templates/scripts/oci/configure-auth.sh

      - name: Load protected script argument
        if: inputs.vault_secret_name != ''
        run: bash .pipeline-templates/scripts/oci/load-vault-secret-argument.sh

      - name: Dispatch and wait for commands
        run: bash .pipeline-templates/scripts/oci/execute-run-command.sh

      - name: Upload Run Command results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.display_name }}-results
          path: run-command-results
          if-no-files-found: warn
          retention-days: 7