#==============================================================================
# SHARED OCI SSH COMMAND WORKFLOW
#==============================================================================

name: Shared OCI SSH command

#==============================================================================
# WORKFLOW INPUTS AND SECRETS
#==============================================================================

on:
  workflow_call:
    inputs:
      automation_repository:
        description: Public repository containing versioned automation scripts
        required: true
        type: string
      automation_ref:
        description: Immutable release tag for the automation repository
        required: true
        type: string
      template_ref:
        description: Immutable release tag containing the workflow support scripts
        required: true
        type: string
      compartment_ocid:
        description: OCI compartment containing the target instances
        required: true
        type: string
      display_name:
        description: Safe name used for temporary access and artifacts
        required: true
        type: string
      region:
        description: OCI region identifier
        required: true
        type: string
      required_output_marker:
        description: Output marker required from every target
        required: true
        type: string
      script_path:
        description: Host script path relative to the automation repository
        required: true
        type: string
      targets_json:
        description: JSON array containing target names, instance OCIDs, SSH users, and script arguments
        required: true
        type: string
    secrets:
      OCI_TENANCY_OCID:
        required: true
      OCI_USER_OCID:
        required: true
      OCI_FINGERPRINT:
        required: true
      OCI_PRIVATE_KEY:
        required: true
      SSH_PRIVATE_KEY:
        required: true

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# VERSIONED SSH AUTOMATION
#==============================================================================

jobs:
  ssh-command:
    name: OCI SSH command
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AUTOMATION_DIRECTORY: ${{ github.workspace }}/.host-automation
      AUTOMATION_REF: ${{ inputs.automation_ref }}
      OCI_CLI_VERSION: 3.91.0
      OCI_COMPARTMENT_OCID: ${{ inputs.compartment_ocid }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ inputs.region }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      REQUIRED_OUTPUT_MARKER: ${{ inputs.required_output_marker }}
      SSH_COMMAND_DISPLAY_NAME: ${{ inputs.display_name }}
      SSH_COMMAND_RESULTS_DIRECTORY: ${{ github.workspace }}/ssh-command-results
      SSH_COMMAND_SCRIPT_PATH: ${{ inputs.script_path }}
      SSH_COMMAND_TARGETS: ${{ inputs.targets_json }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      TEMPLATE_REF: ${{ inputs.template_ref }}

    steps:
      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Checkout versioned host automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.automation_repository }}
          ref: ${{ inputs.automation_ref }}
          path: .host-automation

      - name: Validate SSH command configuration
        run: bash .pipeline-templates/scripts/oci/validate-ssh-command.sh

      - name: Install pinned OCI CLI
        run: bash .pipeline-templates/scripts/oci/install-cli.sh

      - name: Configure OCI authentication
        run: bash .pipeline-templates/scripts/oci/configure-auth.sh

      - name: Configure host SSH key
        run: bash .pipeline-templates/scripts/oci/configure-ssh-key.sh

      - name: Open temporary SSH access
        id: access
        run: bash .pipeline-templates/scripts/oci/open-temporary-ssh-access.sh

      - name: Execute versioned SSH automation
        run: bash .pipeline-templates/scripts/oci/execute-ssh-command.sh

      - name: Close temporary SSH access
        if: always() && steps.access.outputs.nsg_id != ''
        env:
          NSG_ID: ${{ steps.access.outputs.nsg_id }}
          RULE_DESCRIPTION: ${{ steps.access.outputs.description }}
          RULE_ID: ${{ steps.access.outputs.rule_id }}
        run: bash .pipeline-templates/scripts/oci/close-temporary-ssh-access.sh

      - name: Upload SSH command results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.display_name }}-results
          path: ${{ env.SSH_COMMAND_RESULTS_DIRECTORY }}
          if-no-files-found: warn
          retention-days: 7