#==============================================================================
# SHARED SHELL VALIDATION WORKFLOW
#==============================================================================

name: Shared shell validation

#==============================================================================
# WORKFLOW INPUTS
#==============================================================================

on:
  workflow_call:
    inputs:
      search_path:
        description: Repository-relative directory containing shell scripts
        required: false
        type: string
        default: scripts
      template_ref:
        description: Git ref containing the workflow support scripts
        required: false
        type: string
        default: v0.8.0

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# SHELL VALIDATION
#==============================================================================

jobs:
  validate:
    name: Validate shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Validate script syntax
        env:
          SEARCH_PATH: ${{ inputs.search_path }}
        run: bash .pipeline-templates/scripts/validation/validate-shell.sh