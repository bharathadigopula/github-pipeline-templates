#==============================================================================
# PIPELINE TEMPLATE VALIDATION
#==============================================================================

name: Template validation

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS AND CONCURRENCY
#==============================================================================

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# REUSABLE WORKFLOW TEST
#==============================================================================

jobs:
  validate-template:
    name: Validate reusable workflow
    uses: ./.github/workflows/terraform-validate.yml
    with:
      working_directory: tests/fixtures/terraform-basic
    permissions:
      contents: read

  validate-shell-template:
    name: Validate shell workflow
    uses: ./.github/workflows/shell-validate.yml
    with:
      search_path: scripts
    permissions:
      contents: read

  validate-oci-bootstrap-template:
    name: Validate OCI bootstrap workflow
    uses: ./.github/workflows/terraform-oci-bootstrap.yml
    with:
      operation: validate
      working_directory: tests/fixtures/terraform-basic
      template_ref: ${{ github.sha }}
    permissions:
      contents: read