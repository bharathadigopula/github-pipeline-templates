#==============================================================================
# PIPELINE TEMPLATE VALIDATION
#==============================================================================

name: Template validation

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS AND CONCURRENCY
#==============================================================================

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# REUSABLE WORKFLOW TEST
#==============================================================================

jobs:
  validate-template:
    name: Validate reusable workflow
    uses: ./.github/workflows/terraform-validate.yml
    with:
      working_directory: tests/fixtures/terraform-basic
    permissions:
      contents: read

  validate-shell-template:
    name: Validate shell workflow
    uses: ./.github/workflows/shell-validate.yml
    with:
      search_path: scripts
      template_ref: ${{ github.sha }}
    permissions:
      contents: read

  validate-run-command-secrets:
    name: Validate Run Command secret ordering
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test ordered secret arguments
        run: bash tests/test-run-command-secret-order.sh

      - name: Test required check reconciliation
        run: bash tests/test-required-check-reconciliation.sh

  validate-oci-bootstrap-template:
    name: Validate OCI bootstrap workflow
    uses: ./.github/workflows/terraform-oci-bootstrap.yml
    with:
      operation: validate
      working_directory: tests/fixtures/terraform-basic
      template_ref: ${{ github.sha }}
    permissions:
      contents: read