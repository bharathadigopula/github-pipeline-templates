#==============================================================================
# SHARED OCI TERRAFORM BOOTSTRAP WORKFLOW
#==============================================================================

name: Shared OCI Terraform bootstrap

#==============================================================================
# WORKFLOW INPUTS AND SECRETS
#==============================================================================

on:
  workflow_call:
    inputs:
      operation:
        description: Validate, plan, or plan and apply
        required: true
        type: string
      working_directory:
        description: Terraform bootstrap root directory
        required: true
        type: string
      template_ref:
        description: Git ref containing the workflow support scripts
        required: true
        type: string
      terraform_version:
        description: Terraform CLI version with OCI backend support
        required: false
        type: string
        default: 1.15.9
      backend_key:
        description: Object Storage key used for migrated bootstrap state
        required: false
        type: string
        default: bootstrap/prd/terraform.tfstate
    secrets:
      OCI_TENANCY_OCID:
        required: false
      OCI_USER_OCID:
        required: false
      OCI_FINGERPRINT:
        required: false
      OCI_PRIVATE_KEY:
        required: false

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# BOOTSTRAP PLAN APPLY AND STATE MIGRATION
#==============================================================================

jobs:
  plan:
    name: Terraform OCI bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_OPERATION: ${{ inputs.operation }}
      TF_WORKING_DIRECTORY: ${{ inputs.working_directory }}
      TF_BACKEND_KEY: ${{ inputs.backend_key }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Validate deployment configuration
        if: inputs.operation != 'validate'
        run: bash .pipeline-templates/scripts/terraform/validate-oci-bootstrap-inputs.sh

      - name: Configure OCI authentication
        if: inputs.operation != 'validate'
        run: bash .pipeline-templates/scripts/terraform/configure-oci-auth.sh

      - name: Initialise bootstrap with local state
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -backend=false -input=false

      - name: Check formatting
        run: terraform -chdir="$TF_WORKING_DIRECTORY" fmt -check -diff

      - name: Validate bootstrap configuration
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate -no-color

      - name: Create and show bootstrap plan
        id: plan
        if: inputs.operation != 'validate'
        run: bash .pipeline-templates/scripts/terraform/create-terraform-plan.sh "$TF_WORKING_DIRECTORY" bootstrap.tfplan

      - name: Upload bootstrap plan
        if: inputs.operation != 'validate' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-bootstrap-plan
          path: ${{ inputs.working_directory }}/bootstrap.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply OCI bootstrap changes
    needs: plan
    if: inputs.operation == 'apply' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_OPERATION: apply
      TF_WORKING_DIRECTORY: ${{ inputs.working_directory }}
      TF_BACKEND_KEY: ${{ inputs.backend_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Validate deployment configuration
        run: bash .pipeline-templates/scripts/terraform/validate-oci-bootstrap-inputs.sh
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Configure OCI authentication
        run: bash .pipeline-templates/scripts/terraform/configure-oci-auth.sh
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Initialise bootstrap with local state
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -backend=false -input=false

      - name: Download bootstrap plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oci-bootstrap-plan
          path: ${{ inputs.working_directory }}

      - name: Apply bootstrap plan and migrate state
        run: bash .pipeline-templates/scripts/terraform/apply-oci-bootstrap-plan.sh "$TF_WORKING_DIRECTORY" "$TF_BACKEND_KEY" bootstrap.tfplan