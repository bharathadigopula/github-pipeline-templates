#==============================================================================
# SHARED OCI TERRAFORM DEPLOYMENT
#==============================================================================

name: Shared OCI Terraform deployment

#==============================================================================
# WORKFLOW INPUTS AND SECRETS
#==============================================================================

on:
  workflow_call:
    inputs:
      operation:
        description: Plan or plan and apply
        required: true
        type: string
      working_directory:
        description: Terraform root directory
        required: true
        type: string
      template_ref:
        description: Git ref containing the workflow support scripts
        required: true
        type: string
      terraform_version:
        description: Terraform CLI version with OCI backend support
        required: false
        type: string
        default: 1.15.9
      backend_config_file:
        description: Backend configuration file relative to the Terraform root
        required: false
        type: string
        default: backend.hcl.example
      cloudflare_account_id:
        description: Cloudflare account identifier for roots that manage Cloudflare resources
        required: false
        type: string
        default: ""
    secrets:
      OCI_TENANCY_OCID:
        required: true
      OCI_USER_OCID:
        required: true
      OCI_FINGERPRINT:
        required: true
      OCI_PRIVATE_KEY:
        required: true
      SSH_ALLOWED_CIDR:
        required: false
      SSH_PUBLIC_KEY:
        required: false
      BUDGET_ALERT_RECIPIENTS:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      JENKINS_GITHUB_TOKEN:
        required: false

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# REMOTE STATE PLAN AND OPTIONAL APPLY
#==============================================================================

jobs:
  plan:
    name: Terraform OCI plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_OPERATION: ${{ inputs.operation }}
      TF_WORKING_DIRECTORY: ${{ inputs.working_directory }}
      TF_BACKEND_CONFIG_FILE: ${{ inputs.backend_config_file }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_budget_alert_recipients: ${{ secrets.BUDGET_ALERT_RECIPIENTS }}
      TF_VAR_cloudflare_account_id: ${{ inputs.cloudflare_account_id }}
      TF_VAR_jenkins_github_token: ${{ secrets.JENKINS_GITHUB_TOKEN }}
      TF_VAR_oci_user_ocid: ${{ secrets.OCI_USER_OCID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Validate deployment configuration
        run: bash .pipeline-templates/scripts/terraform/validate-oci-terraform-inputs.sh

      - name: Configure OCI authentication
        run: bash .pipeline-templates/scripts/terraform/configure-oci-auth.sh

      - name: Initialise OCI backend
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false -backend-config="$TF_BACKEND_CONFIG_FILE"

      - name: Check formatting
        run: terraform -chdir="$TF_WORKING_DIRECTORY" fmt -check -diff

      - name: Validate Terraform configuration
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate -no-color

      - name: Create and show Terraform plan
        id: plan
        run: bash .pipeline-templates/scripts/terraform/create-terraform-plan.sh "$TF_WORKING_DIRECTORY" terraform.tfplan

      - name: Upload Terraform plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terraform-plan
          path: ${{ inputs.working_directory }}/terraform.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply OCI Terraform changes
    needs: plan
    if: inputs.operation == 'apply' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_OPERATION: apply
      TF_WORKING_DIRECTORY: ${{ inputs.working_directory }}
      TF_BACKEND_CONFIG_FILE: ${{ inputs.backend_config_file }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_budget_alert_recipients: ${{ secrets.BUDGET_ALERT_RECIPIENTS }}
      TF_VAR_cloudflare_account_id: ${{ inputs.cloudflare_account_id }}
      TF_VAR_jenkins_github_token: ${{ secrets.JENKINS_GITHUB_TOKEN }}
      TF_VAR_oci_user_ocid: ${{ secrets.OCI_USER_OCID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathadigopula/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Validate deployment configuration
        run: bash .pipeline-templates/scripts/terraform/validate-oci-terraform-inputs.sh

      - name: Configure OCI authentication
        run: bash .pipeline-templates/scripts/terraform/configure-oci-auth.sh

      - name: Initialise OCI backend
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false -backend-config="$TF_BACKEND_CONFIG_FILE"

      - name: Download Terraform plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: terraform-plan
          path: ${{ inputs.working_directory }}

      - name: Apply Terraform plan and verify state
        run: bash .pipeline-templates/scripts/terraform/apply-terraform-plan.sh "$TF_WORKING_DIRECTORY" terraform.tfplan